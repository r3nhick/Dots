##### CORE OPTIONS #####
set -sg terminal-overrides ",*:RGB"  # true color
set -g escape-time 0
set -g mouse on
set -g renumber-windows on
set -g repeat-time 1000

# Start indexes from 1
set -g base-index 1
set -g pane-base-index 1

##### PREFIX #####
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##### THEME: BORDERS #####
set -g pane-border-lines simple
set -g pane-border-style fg=default
set -g pane-active-border-style fg=cyan

##### THEME: STATUS BAR #####
set -g status-style fg=brightblack,bg=default
set -g status-left ""
set -g status-right "#[fg=brightblack]#S"
set -g window-status-format "●"
set -g window-status-style fg=brightblack
set -g window-status-current-format "●"
set -g window-status-current-style fg=cyan,bold
set -g window-status-bell-style "fg=red,nobold"
set -g message-style fg=cyan,bold
##### PANE NAVIGATION (WASD) #####
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R
bind -r W resize-pane -U
bind -r A resize-pane -L
bind -r S resize-pane -D
bind -r D resize-pane -R
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

##### SPLITS #####
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v

##### WINDOWS #####
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

##### OTHER #####
bind f resize-pane -Z
bind q detach-client
bind e choose-window -Z
bind T choose-tree -sZ -O name

##### ALT + WASD (NO PREFIX) #####
bind -n M-w select-pane -U
bind -n M-a select-pane -L
bind -n M-s select-pane -D
bind -n M-d select-pane -R
bind -n M-f resize-pane -Z

##### QUALITY OF LIFE #####
bind r source-file ~/.tmux.conf \; display "Reloaded!"

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Автовідновлення сесій при запуску tmux
set -g @continuum-restore 'on'
# Автозбереження кожні 15 хвилин
set -g @continuum-save-interval '15'

# Ініціалізація TPM (завжди останній рядок)
run '~/.tmux/plugins/tpm/tpm'
